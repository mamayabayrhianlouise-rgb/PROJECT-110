<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotezy | Get a Quote</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="navbar">
            <div class="logo">QUOTEZY</div>
            <nav class="nav-links">
                <a href="index.html">← Back to Portfolio</a>
            </nav>
        </div>
    </header>

    <main class="quote-main" id="app">

        <p class="quote-label">— YOUR DAILY QUOTE —</p>

        <h1 class="quote-title">
            A Quote<br>For Your Day.
        </h1>

        <div class="quote-display" aria-live="polite">
            <p id="quote">
                Click the button below to discover a quote.
            </p>

            <p id="author">— Quotezy</p>
        </div>

        <p id="loading" class="loading hidden">
            Fetching your quote...
        </p>

        <p id="errorMessage"
           class="error-message hidden"
           role="alert"></p>

        <div class="button-row">

            <button type="button"
                    id="getQuoteButton"
                    class="reveal-button">
                <span>GET A QUOTE</span>
                <strong>➜</strong>
            </button>

            <button type="button"
                    id="copyButton"
                    class="copy-button">
                COPY QUOTE
            </button>

        </div>

        <p class="quote-counter">
            Quotes discovered:
            <span id="quoteCount">0</span>
        </p>

        <p class="quote-message">
            One quote. One thought. One better day.
        </p>

    </main>

    <footer class="footer">
        <span>© 2026 Quotezy</span>
        <span>One Quote. One Thought. One Better Day.</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
